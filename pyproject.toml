[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-notify"
dynamic = ["version"]
description = "Cross-platform notification system for Claude Code hooks with intelligent project detection"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "jamez01", email = "james@example.com"}
]
keywords = ["claude", "ai", "notifications", "hooks", "cross-platform", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
    "Topic :: Communications",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "plyer>=2.1",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/jamez01/claude-notify"
Repository = "https://github.com/jamez01/claude-notify.git"
Issues = "https://github.com/jamez01/claude-notify/issues"

[project.scripts]
claude-notify = "claude_notify.cli:main"

[tool.setuptools]
packages = ["claude_notify"]

# Single source of truth for the version: claude_notify/__init__.py::__version__.
# setuptools reads the literal statically (no import), so the package's runtime
# dependencies are not required at build time.
[tool.setuptools.dynamic]
version = {attr = "claude_notify.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Start from ruff's default rules (pyflakes + a safe pycodestyle subset), which
# catch real defects (unused imports, undefined names). Broaden to "I", "UP",
# "B" and the full "E"/"W" sets after a one-off formatting pass — those flag
# pre-existing import order/whitespace style across every module.

[tool.ruff.lint.per-file-ignores]
# Pre-existing unused imports that sibling fix branches remove. Drop these
# entries once those branches land:
#   notifier.py        -> fix/notifier-shell-injection (uses os, drops Optional/Any)
#   session_monitor.py -> fix/session-monitor-any-type (drops os/json)
"claude_notify/notifier.py" = ["F401"]
"claude_notify/session_monitor.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Tightened to strict over time as the existing modules are annotated.
check_untyped_defs = true
