name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Install runtime + dev deps directly rather than `pip install -e .` so CI
        # does not depend on package/version resolution (hardened on a separate
        # branch); pytest imports the source tree via [tool.pytest] pythonpath.
        run: |
          python -m pip install --upgrade pip
          pip install plyer click pyyaml pytest ruff mypy types-PyYAML

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

      - name: Type check (mypy)
        run: mypy claude_notify
